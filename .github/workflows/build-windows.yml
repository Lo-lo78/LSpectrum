name: Build LSpectrum VST3 Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test silent-frame averaging
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Package VST3 and manuals
        shell: pwsh
        run: |
          $sourcePath = 'build/LSpectrum_artefacts/Release/VST3'
          $plugins = @(Get-ChildItem -Path $sourcePath -Filter '*.vst3' -Directory)
          if ($plugins.Count -ne 1) { throw "Expected one VST3 directory, found $($plugins.Count)" }
          New-Item -ItemType Directory -Force -Path 'dist/package' | Out-Null
          Copy-Item -LiteralPath $plugins[0].FullName -Destination 'dist/package/' -Recurse
          Copy-Item -LiteralPath 'docs' -Destination 'dist/package/' -Recurse
          Copy-Item -LiteralPath 'LICENSE' -Destination 'dist/package/'
          Copy-Item -LiteralPath 'COPYRIGHT.md' -Destination 'dist/package/'
          Copy-Item -LiteralPath 'README.md' -Destination 'dist/package/'
          Copy-Item -LiteralPath 'ABOUT.txt' -Destination 'dist/package/'
          Copy-Item -LiteralPath 'GUIDA_RAPIDA.txt' -Destination 'dist/package/'
          Copy-Item -LiteralPath 'RELEASE_NOTES_IT.md' -Destination 'dist/package/'
          Copy-Item -LiteralPath 'RELEASE_NOTES_EN.md' -Destination 'dist/package/'
          Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/LSpectrum.0.99.1.VST3.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LSpectrum-0.99.1-Windows-x64
          path: dist/LSpectrum.0.99.1.VST3.zip
          if-no-files-found: error
